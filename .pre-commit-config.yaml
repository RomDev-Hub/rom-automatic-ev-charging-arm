# Hook do framework pre-commit (https://pre-commit.com) quản lý; repo không dùng husky.
# `pre-commit install` cài hook pre-commit và commit-msg vào .git/hooks/ của từng bản clone.
# CI chạy lại đúng cấu hình này bằng `pre-commit run --all-files`.
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  # Mỗi rev ghim theo SHA của commit; chú thích "frozen" ghi tag tương ứng. Dependabot mở PR khi có bản mới.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # .bat và .cmd giữ CRLF theo .gitattributes.
        exclude: \.(bat|cmd)$
      - id: check-yaml
        # pnpm 12 ghi lockfile thành nhiều document YAML, check-yaml không đọc được dạng này.
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # Dữ liệu, bản ghi và model nằm ngoài Git; file trên 1 MiB bị chặn.
        args: [--maxkb=1024]
      - id: detect-private-key
      # Không commit thẳng lên main hay develop: mọi thay đổi vào hai nhánh này đi qua pull request.
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
  # Tìm bí mật (token, khoá, mật khẩu) trong phần sắp commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  # Kiểm Markdown theo .markdownlint.yaml.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # Kiểm workflow GitHub Actions; máy có shellcheck thì kiểm luôn các đoạn script trong workflow.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  # Lint và định dạng bằng ruff, cùng bản với ruff trong robot-core/uv.lock; cấu hình chung ở ruff.toml của gốc repo.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format
  # Chặn commit khi robot-core/uv.lock không còn khớp với robot-core/pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: d1df990f871e616da38bb602a2671d5e840b9989  # frozen: 0.13.7
    hooks:
      - id: uv-lock
        files: ^robot-core/(pyproject\.toml|uv\.lock)$
        args: [--check, --project, robot-core]
  # Hook viết riêng cho repo.
  - repo: local
    hooks:
      # Chặn thư mục nằm ngoài bố cục cho phép (CONTRIBUTING.md, mục "Bố cục thư mục").
      - id: check-layout
        name: check repository layout
        entry: python scripts/check_layout.py
        language: python
        pass_filenames: false
        always_run: true
      - id: commitlint
        name: commitlint
        entry: pnpm exec commitlint --edit  # luật nằm trong commitlint.config.mjs
        language: system
        stages: [commit-msg]
