# Hook do framework pre-commit (https://pre-commit.com) quản lý; repo không dùng husky.
# `pre-commit install` cài hook pre-commit và commit-msg vào .git/hooks/ của từng bản clone.
# CI chạy lại đúng cấu hình này bằng `pre-commit run --all-files`.
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  # Mỗi rev ghim theo SHA của commit; chú thích "frozen" ghi tag tương ứng.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # .bat và .cmd giữ CRLF theo .gitattributes.
        exclude: \.(bat|cmd)$
      - id: check-yaml
        # pnpm 12 ghi lockfile thành nhiều document YAML, check-yaml không đọc được dạng này.
        exclude: ^pnpm-lock\.yaml$
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        # Dữ liệu, bản ghi và model nằm ngoài Git; file trên 1 MiB bị chặn.
        args: [--maxkb=1024]
      - id: detect-private-key
      # Không commit thẳng lên main hay develop: mọi thay đổi vào hai nhánh này đi qua pull request.
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
  # Tìm bí mật (token, khoá, mật khẩu) trong phần sắp commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks
  # Kiểm Markdown theo .markdownlint.yaml.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4  # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # Hook viết riêng cho repo.
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: pnpm exec commitlint --edit  # luật nằm trong commitlint.config.mjs
        language: system
        stages: [commit-msg]
