# Kiểm tra trên mọi lần push vào main, develop và mọi PR: hook, quy ước commit, bí mật, giấy phép, test của robot-core và operator-ui.
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Token của workflow chỉ được đọc repo.
permissions:
  contents: read

# Lần push mới huỷ lần chạy cũ còn dở trên cùng nhánh.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phiên bản công cụ ghim cứng; tarball gitleaks được kiểm SHA-256 trước khi chạy.
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  PRE_COMMIT_VERSION: 4.7.0
  # Giấy phép dependency không bị cảnh báo, dạng mảng JSON; bước kê giấy phép npm và job kê giấy phép Python dùng chung danh sách này.
  ALLOWED_LICENCES: '["MIT", "ISC", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "0BSD", "BlueOak-1.0.0", "CC0-1.0", "Python-2.0", "MIT OR Apache-2.0", "AGPL-3.0-or-later"]'

jobs:
  checks:
    runs-on: ubuntu-24.04
    # Khoảng commit vừa push hoặc của PR, dùng cho commitlint và cho việc xét có chạy job windows hay không.
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    outputs:
      level1: ${{ steps.changes.outputs.level1 }}
      build: ${{ steps.build_inputs.outputs.build }}
    steps:
      # Lấy toàn bộ lịch sử để kiểm từng commit; không lưu token vào .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Job windows chỉ chạy khi khoảng commit đổi mã Python, HMI, file khai báo của pnpm hoặc chính workflow này (ADR 0008).
      # Xét ở đây để không chạy job Windows khi thay đổi không cần tới nó; khoảng commit không xác định được (nhánh mới, push đè) thì vẫn chạy.
      - name: Detect level 1 changes
        id: changes
        run: |
          level1=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- robot-core operator-ui package.json pnpm-workspace.yaml pnpm-lock.yaml .github/workflows/ci.yaml; then
            level1=false
          fi
          echo "level1=${level1}" >> "$GITHUB_OUTPUT"

      # Job build-artifacts chỉ chạy khi khoảng commit đổi Dockerfile, file khai báo hay lockfile mà image dùng, hoặc workflow phát hành; khoảng commit không xác định được thì vẫn chạy.
      - name: Detect image build changes
        id: build_inputs
        run: |
          build=true
          if [ -n "$BASE_SHA" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git diff --quiet "${BASE_SHA}...${HEAD_SHA}" -- deploy/docker .dockerignore robot-core/pyproject.toml robot-core/uv.lock robot-core/.python-version robot-core/LICENSE package.json pnpm-workspace.yaml pnpm-lock.yaml operator-ui/package.json .github/workflows/release.yaml; then
            build=false
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"

      # Cài đúng bản pnpm ghi trong devEngines của package.json.
      - name: Install pnpm from devEngines
        run: |
          version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP" && npm install -g "pnpm@${version}"

      # Cài dependency đúng như pnpm-lock.yaml; lockfile lệch với package.json thì dừng.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Kiểm chính bộ luật commit: mẫu sai phải bị chặn, mẫu đúng phải qua.
      - name: Commit rules reject and accept the reference messages
        run: |
          bad=(
            "feat: Thêm trạng thái chờ"
            "feat: thêm trạng thái chờ."
            "feat(robot): thêm trạng thái chờ"
            "update: thêm trạng thái chờ"
            "feat(mission): thêm trạng thái chờ tài xế rời xe rồi mới cho tay máy chạy"
            "fix(safety): chặn chạy ray khi tay chưa thu về"
            $'fix(motion): giới hạn tốc độ tiếp cận\n\n- Why: tay chạy nhanh khi gần xe.\n- How: hạ tốc độ trong 0,3 m cuối.'
            $'fix(motion): giới hạn tốc độ tiếp cận\n\n- How: hạ tốc độ trong 0,3 m cuối.\n- Why: tay chạy nhanh khi gần xe.\n- Test: test sim cho 3 tư thế.'
            $'feat(api)!: đổi tên trường pha\n\n- Why: tên cũ trùng với sự kiện khác.'
            $'feat(api): đổi tên trường pha\n\n- Why: tên cũ trùng với sự kiện khác.\n\nBREAKING CHANGE: client đọc trường mới'
          )
          good=(
            "feat(mission): thêm trạng thái chờ tài xế rời xe"
            "build(deps): bump vite from 8.1.0 to 8.1.1"
            $'fix(motion): giới hạn tốc độ tiếp cận\n\n- Why: tay chạy nhanh khi gần xe.\n- How: hạ tốc độ trong 0,3 m cuối.\n- Test: test sim cho 3 tư thế.'
            $'feat(api)!: đổi tên trường pha\n\n- Why: tên cũ trùng với sự kiện khác.\n\nBREAKING CHANGE: client đọc trường mới'
            $'revert: feat(mission): thêm trạng thái chờ tài xế rời xe khi người còn gần\n\nThis reverts commit 1234567.\n\nCảm biến nhiễu làm máy chờ mãi.'
          )
          status=0
          for message in "${bad[@]}"; do
            if printf '%s\n' "$message" | pnpm exec commitlint > /dev/null; then
              echo "::error::accepted a message that must be rejected: ${message%%$'\n'*}"; status=1
            fi
          done
          for message in "${good[@]}"; do
            if ! printf '%s\n' "$message" | pnpm exec commitlint > /dev/null; then
              echo "::error::rejected a message that must be accepted: ${message%%$'\n'*}"; status=1
            fi
          done
          exit "$status"

      # Kiểm thông điệp của mọi commit trong khoảng vừa push hoặc trong PR.
      - name: Lint commit messages
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="$HEAD_SHA"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          status=0
          for sha in $(git rev-list --no-merges "$range"); do
            # Bỏ qua commit do Dependabot viết: body do bot sinh có dòng dài và ghi chú phát hành.
            if [ "$(git log -1 --format=%an "$sha")" = "dependabot[bot]" ]; then
              continue
            fi
            git log -1 --format=%B "$sha" | pnpm exec commitlint || status=1
          done
          exit "$status"

      # Chạy mọi hook trong .pre-commit-config.yaml trên toàn bộ file, trừ no-commit-to-branch: hook đó chặn commit ở máy, còn CI chạy trên main hay develop thì checkout đứng ở chính nhánh đó.
      - name: Pre-commit hooks on all files
        env:
          SKIP: no-commit-to-branch
        run: pipx run "pre-commit==${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure

      # Quét bí mật trên toàn bộ lịch sử commit, không chỉ phần vừa thêm.
      - name: Scan the full history for secrets
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --verbose

      # Liệt kê giấy phép của dependency; chỉ cảnh báo, không làm CI đỏ.
      - name: Dependency licences (warning only)
        continue-on-error: true
        run: |
          pnpm licenses list --json > "$RUNNER_TEMP/licenses.json"
          # Đoạn trong dấu nháy đơn là mã node; ${...} là biến của node chứ không phải của shell.
          # shellcheck disable=SC2016
          pnpm exec node -e '
            const allowed = new Set(JSON.parse(process.env.ALLOWED_LICENCES));
            const inventory = require(process.argv[1]);
            for (const [license, packages] of Object.entries(inventory)) {
              if (!allowed.has(license)) {
                console.log(`::warning::licence ${license}: ${packages.map((p) => p.name).join(", ")}`);
              }
            }
          ' "$RUNNER_TEMP/licenses.json"

  # Cổng chốt của CI (ADR 0008): test của robot-core chạy trong target dev của image core, trên đúng thư viện hệ thống của image chạy thật.
  python-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Lớp image lưu trong cache của GitHub Actions; mode=max giữ cả stage builder, nên ur_rtde chỉ build lại khi dependency đổi.
      - name: Build the core dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/core.Dockerfile
          target: dev
          load: true
          tags: ev-arm-core:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test chạy không có mạng; một test bị bỏ qua, ví dụ test cần Pinocchio, cũng làm job thất bại (ADR 0008).
      - name: Run pytest offline and fail on skipped tests
        run: |
          docker run --rm --network none ev-arm-core:ci pytest -ra | tee "$RUNNER_TEMP/pytest.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::pytest skipped a test; the Linux job allows no skipped test"
            exit 1
          fi

  # Test và bản build của operator-ui; lint, định dạng, kiểm kiểu và kiểm kiểu sinh từ contracts/ đã chạy dưới dạng hook trong job checks.
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm from devEngines
        run: |
          version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP" && npm install -g "pnpm@${version}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run operator-ui tests
        run: pnpm --filter operator-ui run test

      - name: Build operator-ui for production
        run: pnpm --filter operator-ui run build

  # Kê giấy phép của dependency Python đã khoá trong robot-core/uv.lock; chỉ cảnh báo, không làm CI đỏ (ADR 0011).
  python-licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python dependency licences (warning only)
        continue-on-error: true
        run: python3 scripts/list_python_licences.py robot-core/uv.lock

  # Mức 1 trên Windows (ADR 0008); chỉ chạy khi bước "Detect level 1 changes" của job checks báo khoảng commit có đổi.
  windows:
    needs: checks
    if: needs.checks.outputs.level1 == 'true'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv cùng bản với image uv ghim trong core.Dockerfile (ADR 0008), nên không có chỗ ghim thứ ba.
      - name: Read the uv version from core.Dockerfile
        id: uv
        run: |
          version="$(sed -nE 's#^FROM ghcr\.io/astral-sh/uv:([^@]+)@.*#\1#p' deploy/docker/core.Dockerfile)"
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}

      - name: Install robot-core from uv.lock
        working-directory: robot-core
        run: uv sync --locked

      - name: Run robot-core tests
        working-directory: robot-core
        run: uv run --locked pytest

      - name: Type-check robot-core
        working-directory: robot-core
        run: uv run --locked mypy

      - name: Install pnpm from devEngines
        run: |
          version="$(node -p "require('./package.json').devEngines.packageManager.version")"
          cd "$RUNNER_TEMP" && npm install -g "pnpm@${version}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run operator-ui tests
        run: pnpm --filter operator-ui run test

  # Build đủ image phát hành như job build của workflow release, mọi kiến trúc, nhưng không đẩy đi, để biết chắc build được trước khi merge.
  # Chỉ chạy trên PR phát hành, PR vá gấp và PR đổi Dockerfile, file khai báo hay lockfile mà image dùng, để không build bốn image cho thay đổi không cần tới chúng.
  # PR phát hành và PR vá gấp nhận ra theo nhánh release/X.Y.Z và hotfix/X.Y.Z.
  build-artifacts:
    needs: checks
    if: >-
      github.event_name == 'pull_request'
      && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/') || needs.checks.outputs.build == 'true')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        image: [core, hmi]
        arch: [amd64, arm64]
        include:
          - image: core
            target: runtime
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cùng Dockerfile, target và nền tảng như workflow release; cache chỉ đọc.
      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha
