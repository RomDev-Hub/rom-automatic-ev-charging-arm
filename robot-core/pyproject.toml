[project]
name = "robot-core"
dynamic = ["version"]
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
# Bản chép đúng từng byte của LICENSE ở gốc repo: PEP 639 không cho license-files trỏ ra ngoài thư mục chứa pyproject.toml.
license-files = ["LICENSE"]
dependencies = [
  "argon2-cffi>=25.1.0",
  "fastapi>=0.162.5",
  "mcap>=1.6.0",
  "numpy>=2.5.4",
  # Chỉ khai cho Linux vì PyPI không có wheel Pinocchio cho Windows (ADR 0008).
  "pin>=4.1.0; sys_platform == 'linux'",
  # Chỉ adapter UR dùng, chạy trên Linux; PyPI không có wheel cho Python 3.14 nên luôn build từ source (ADR 0008).
  "ur_rtde==1.6.5; sys_platform == 'linux'",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
robot-core = "robot_core.cli.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling>=1.33.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Gốc repo Git là thư mục cha của robot-core; phiên bản lấy từ tag vX.Y.Z gần nhất.
# dist_name: build trong Docker đặt phiên bản bằng SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ROBOT_CORE, không ảnh hưởng gói khác cũng dùng setuptools-scm như ur_rtde.
raw-options = { root = "..", dist_name = "robot-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/robot_core"]

[tool.uv]
# Phiên bản lấy từ Git, nên mỗi commit hoặc tag mới thì cài lại project để metadata đúng phiên bản.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
# Ghim gói build của ur_rtde: setup.py của nó còn import distutils, chỉ chạy nhờ bản đi kèm setuptools (ADR 0008).
# Ràng buộc áp cho mọi gói build từ source, kể cả robot-core, vì hatch-vcs cần setuptools-scm.
build-constraint-dependencies = [
  "pybind11==3.1.0",
  "setuptools==84.2.1",
  "setuptools-scm==10.3.4",
]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# Pinocchio không kèm stub kiểu, và không được cài trên Windows.
module = ["pinocchio"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
# Chế độ importlib cho phép hai file test trùng tên ở hai thư mục khác nhau mà không cần __init__.py.
addopts = ["--import-mode=importlib"]
strict = true
